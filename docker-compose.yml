services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ventriloc-hr-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-gigachat}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-3-Ultra}
      GIGACHAT_API_URL: ${GIGACHAT_API_URL:-https://api.giga.chat/v1/chat/completions}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-false}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-1}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-4}
      PII_REDACTION_ENABLED: ${PII_REDACTION_ENABLED:-true}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      DATABASE_PATH: /app/data/ventriloc_hr.db
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-ventriloc-hr-local-secret-change-me}
      CASE_SAMPLES_DIR: /app
    volumes:
      - hr_data:/app/data
      - "./4 резюме кондидатов:/app/samples/resumes:ro"
      - "./Вакансия 1.docx:/app/samples/vacancies/Вакансия 1.docx:ro"
      - "./Вакансия 2.docx:/app/samples/vacancies/Вакансия 2.docx:ro"
      - "./Вакансия 3.docx:/app/samples/vacancies/Вакансия 3.docx:ro"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ventriloc-hr-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hr_data:
